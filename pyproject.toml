[project]
name = "lectureqa"
version = "0.1.0"
description = "LectureQA - 课程讲义智能问答助手 (DSC6021 Generative AI final project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=1.24.0",
    "chromadb>=0.5.5",
    "openai>=1.40.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "streamlit>=1.38.0",
    "streamlit-pdf-viewer>=0.0.45",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
rerank = ["sentence-transformers>=3.0.0"]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[project.scripts]
lectureqa = "lectureqa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lectureqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "app"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入惯用法就是 Depends(...) 作为参数默认值
"src/lectureqa/api/main.py" = ["B008"]
